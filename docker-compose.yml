services:
  media-audit:
    image: media-audit:latest
    build: .
    container_name: media-audit
    ports:
      - "8080:8080"
    environment:
      # Scan settings
      SCAN_ROOTS: /media/Downloads,/media/Movies,/media/Series
      SCAN_INTERVAL_DAYS: 7
      DOWNLOADS_DIR: /media/Downloads
      MEDIA_AUDIT_USERNAME: ${MEDIA_AUDIT_USERNAME:?Set MEDIA_AUDIT_USERNAME in .env}
      MEDIA_AUDIT_PASSWORD: ${MEDIA_AUDIT_PASSWORD:?Set MEDIA_AUDIT_PASSWORD in .env}
    
    volumes:
      # Hardlink replacement requires read-write access to all media directories.
      # Mount the common parent so the container sees one filesystem.
      - ${MEDIA_ROOT:-/volume1/Media}:/media:rw
      # Data persistence
      - ./data:/app/data
    
    restart: unless-stopped
